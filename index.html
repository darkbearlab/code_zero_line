<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code: Zero Line</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0c0a;
        color: #cfe8cf;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
        height: 100%;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #hud > * {
        pointer-events: auto;
      }
      #hud-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 8px 16px;
        background: rgba(10, 14, 10, 0.85);
        border-bottom: 1px solid #2a3a2a;
        display: flex;
        gap: 18px;
        align-items: center;
        font-size: 13px;
      }
      #hud-progress {
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 3px;
        border: 1px solid transparent;
      }
      #hud-progress.tone-normal { color: #cfe8cf; border-color: #2a4a2a; background: rgba(40,80,40,0.2); }
      #hud-progress.tone-warn   { color: #ffd166; border-color: #6a5a2a; background: rgba(120,90,30,0.25); }
      #hud-progress.tone-danger { color: #ff8a6a; border-color: #6a2a2a; background: rgba(120,40,30,0.3); }
      #hud-progress.tone-win    { color: #6affb0; border-color: #2a6a4a; background: rgba(40,120,80,0.3); animation: hud-progress-pulse 1.2s ease-in-out infinite; }
      @keyframes hud-progress-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      #hud-unit-details {
        position: absolute;
        top: 48px;
        left: 12px;
        width: 300px;
        max-height: calc(100vh - 160px);
        overflow-y: auto;
        padding: 10px 12px;
        background: rgba(10, 14, 10, 0.92);
        border: 1px solid #3a5a3a;
        font-size: 13px;
        line-height: 1.5;
        color: #cfe8cf;
        pointer-events: auto;
      }
      #hud-unit-details::after {
        content: '📌';
        position: absolute;
        top: 6px;
        right: 8px;
        font-size: 12px;
        opacity: 0.45;
        pointer-events: none;
      }
      #hud-unit-details .ud-name {
        font-size: 15px;
        font-weight: bold;
        color: #cfe8cf;
        margin-bottom: 2px;
      }
      #hud-unit-details .ud-sub {
        font-size: 12px;
        color: #9aa89a;
        margin-bottom: 8px;
      }
      #hud-unit-details .ud-faction-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
        border: 1px solid #2a3a2a;
      }
      #hud-unit-details .ud-section {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid #2a3a2a;
      }
      #hud-unit-details .ud-section-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7a9a7a;
        margin-bottom: 4px;
      }
      #hud-unit-details .ud-stat {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      #hud-unit-details .ud-stat .k {
        color: #9aa89a;
      }
      #hud-unit-details .ud-stat .v {
        color: #cfe8cf;
      }
      #hud-unit-details .ud-stat .v.danger {
        color: #ff8a6a;
      }
      #hud-unit-details .ud-stat .v.warn {
        color: #ffd166;
      }
      #hud-unit-details .ud-list {
        margin: 0;
        padding-left: 0;
        list-style: none;
      }
      #hud-unit-details .ud-list li {
        padding: 2px 0;
      }
      #hud-unit-details .ud-trait .name {
        color: #9af09a;
        font-weight: bold;
      }
      #hud-unit-details .ud-trait .desc {
        display: block;
        color: #9aa89a;
        font-size: 11px;
        margin-left: 6px;
      }
      #hud-unit-details .ud-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #hud-unit-details .ud-tag {
        display: inline-block;
        padding: 1px 7px;
        background: #1a2a1a;
        border: 1px solid #3a5a3a;
        border-radius: 9px;
        color: #9af09a;
        font-size: 11px;
      }
      #hud-unit-details .ud-weapon .name {
        color: #cfe8cf;
      }
      #hud-unit-details .ud-weapon .meta {
        color: #7a9a7a;
        font-size: 11px;
        margin-left: 6px;
      }
      #hud-unit-details .ud-weapon .descs {
        display: block;
        color: #9aa89a;
        font-size: 11px;
        margin-left: 6px;
      }
      #hud-top .holder-A {
        color: #6ab0ff;
      }
      #hud-top .holder-B {
        color: #ff8a6a;
      }
      #hud-ai-toggles {
        margin-left: auto;
        display: inline-flex;
        gap: 10px;
        color: #cfe8cf;
      }
      #hud-ai-toggles label {
        cursor: pointer;
        user-select: none;
      }
      #hud-ai-toggles input {
        vertical-align: middle;
        margin-right: 4px;
      }
      #hud-timer {
        padding: 2px 8px;
        background: #1a2a1a;
        border: 1px solid #3a5a3a;
        color: #ffd166;
        font-variant-numeric: tabular-nums;
      }
      #hud-timer[hidden] {
        display: none;
      }
      #hud-frame {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }
      #hud-frame[hidden] {
        display: none;
      }
      #hud-frame-rect {
        fill: none;
        stroke-width: 6;
        vector-effect: non-scaling-stroke;
        transition: stroke 200ms ease;
      }
      #hud-frame-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        overflow: hidden;
      }
      #hud-frame-glow[hidden] {
        display: none;
      }
      #hud-frame-glow .edge {
        position: absolute;
        pointer-events: none;
        will-change: transform;
      }
      #hud-frame-glow .edge-left {
        left: 0;
        top: 0;
        bottom: 0;
        width: 90px;
      }
      #hud-frame-glow .edge-right {
        right: 0;
        top: 0;
        bottom: 0;
        width: 90px;
      }
      #hud-frame-glow .edge-top {
        left: 0;
        right: 0;
        top: 0;
        height: 90px;
      }
      #hud-frame-glow .edge-bottom {
        left: 0;
        right: 0;
        bottom: 0;
        height: 90px;
      }
      #hud-frame-glow.faction-A .edge-left {
        background: linear-gradient(
          to right,
          rgba(106, 176, 255, 0.55),
          rgba(106, 176, 255, 0)
        );
      }
      #hud-frame-glow.faction-A .edge-right {
        background: linear-gradient(
          to left,
          rgba(106, 176, 255, 0.55),
          rgba(106, 176, 255, 0)
        );
      }
      #hud-frame-glow.faction-A .edge-top {
        background: linear-gradient(
          to bottom,
          rgba(106, 176, 255, 0.55),
          rgba(106, 176, 255, 0)
        );
      }
      #hud-frame-glow.faction-A .edge-bottom {
        background: linear-gradient(
          to top,
          rgba(106, 176, 255, 0.55),
          rgba(106, 176, 255, 0)
        );
      }
      #hud-frame-glow.faction-B .edge-left {
        background: linear-gradient(
          to right,
          rgba(255, 138, 106, 0.55),
          rgba(255, 138, 106, 0)
        );
      }
      #hud-frame-glow.faction-B .edge-right {
        background: linear-gradient(
          to left,
          rgba(255, 138, 106, 0.55),
          rgba(255, 138, 106, 0)
        );
      }
      #hud-frame-glow.faction-B .edge-top {
        background: linear-gradient(
          to bottom,
          rgba(255, 138, 106, 0.55),
          rgba(255, 138, 106, 0)
        );
      }
      #hud-frame-glow.faction-B .edge-bottom {
        background: linear-gradient(
          to top,
          rgba(255, 138, 106, 0.55),
          rgba(255, 138, 106, 0)
        );
      }
      #hud-actions {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        top: auto;
        width: auto;
        max-height: 180px;
        padding: 8px 16px;
        background: rgba(10, 14, 10, 0.92);
        border-top: 1px solid #2a3a2a;
        border-left: none;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        align-content: flex-start;
        gap: 5px 10px;
        font-size: 12px;
        overflow-y: auto;
        z-index: 10;
      }
      #hud-actions h3 {
        flex-basis: 100%;
        margin: 4px 0 2px;
        font-size: 12px;
        color: #7a9a7a;
        font-weight: normal;
        letter-spacing: 0.5px;
      }
      #hud-actions h3:first-child {
        margin-top: 0;
      }
      #hud-actions button {
        background: #1a2a1a;
        color: #cfe8cf;
        border: 1px solid #3a5a3a;
        padding: 5px 10px;
        font: inherit;
        cursor: pointer;
        text-align: left;
        flex-shrink: 0;
        white-space: nowrap;
      }
      #hud-actions button:hover {
        background: #2a4a2a;
      }
      #hud-actions button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      /* Sub-labels and candidate rows take up a full line */
      #hud-actions > div {
        flex-basis: 100%;
        flex-shrink: 0;
      }
      /* Inline red warning chip inside a button (e.g. SOLO 未壓制即易手) */
      #hud-actions button .risk-tag {
        color: #ff8a6a;
        font-size: 10px;
        margin-left: 8px;
        font-weight: bold;
      }
      /* Two-line button: small grey/red subtitle on a new line under main label */
      #hud-actions button .btn-sub {
        display: block;
        font-size: 10px;
        color: #8aa28a;
        font-weight: normal;
        margin-top: 2px;
        white-space: normal;
      }
      #hud-actions button .btn-sub.warn {
        color: #ff8a6a;
      }
      /* Pre-action red banner (e.g. 困難地形:移動上限 1·主動權結束) */
      #hud-actions .danger-banner {
        background: rgba(255, 138, 106, 0.15);
        border: 1px solid #ff8a6a;
        color: #ffd0c2;
        padding: 6px 10px;
        font-size: 12px;
        line-height: 1.4;
        margin-bottom: 4px;
      }
      /* Log: top-right corner, 1-line compact by default */
      #hud-log-wrap {
        position: absolute;
        top: 52px;
        right: 8px;
        bottom: auto;
        left: auto;
        width: 300px;
        max-width: calc(100vw - 20px);
        background: rgba(10, 14, 10, 0.88);
        border: 1px solid #2a3a2a;
        border-radius: 3px;
        z-index: 12;
      }
      #hud-log-toggle {
        position: static;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
        background: rgba(10, 14, 10, 0.95);
        border: none;
        border-bottom: 1px solid #1a2a1a;
        color: #6a8a6a;
        font: inherit;
        font-size: 11px;
        padding: 2px 8px;
        cursor: pointer;
        line-height: 1.4;
        text-align: right;
      }
      #hud-log-toggle:hover {
        background: #1a2a1a;
        color: #cfe8cf;
      }
      /* Default: 5-line view at 14px so recent events stay readable */
      #hud-log {
        height: 110px;
        padding: 4px 8px;
        font-size: 14px;
        line-height: 1.5;
        overflow-y: auto;
        white-space: pre-wrap;
        color: #cfe8cf;
        scrollbar-width: thin;
      }
      #hud-log::-webkit-scrollbar {
        display: none;
      }
      /* "collapsed" in Hud.ts = user clicked to expand */
      #hud-log-wrap.collapsed #hud-log {
        height: 240px;
        padding: 6px 8px;
        white-space: pre-wrap;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      #hud-log-wrap.collapsed #hud-log::-webkit-scrollbar {
        display: initial;
      }
      /* When scrubber is visible, lift actions panel above it so buttons stay clickable */
      #hud:has(#hud-scrubber:not([hidden])) #hud-actions {
        bottom: 74px;
      }
      #hud-scrubber {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 10px 16px;
        background: rgba(20, 30, 20, 0.95);
        border-top: 2px solid #4a7a4a;
        font-size: 12px;
        z-index: 12;
      }
      #hud-scrubber[hidden] {
        display: none;
      }
      #hud-scrubber-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #hud-scrubber-label {
        min-width: 110px;
        color: #cfe8cf;
      }
      #hud-scrubber-track {
        flex: 1;
        position: relative;
        height: 22px;
        display: flex;
        align-items: center;
      }
      #hud-scrubber-windows {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        height: 6px;
        pointer-events: none;
        z-index: 1;
      }
      #hud-scrubber-windows .hud-scrubber-window {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(255, 85, 85, 0.6);
        border-radius: 1px;
      }
      #hud-scrubber-input {
        width: 100%;
        position: relative;
        z-index: 2;
        background: transparent;
      }
      #hud-scrubber-help {
        color: #7a9a7a;
        font-size: 11px;
        margin-top: 6px;
        line-height: 1.4;
      }
      #settings-menu {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.55);
        font-family: monospace;
      }
      #settings-menu[hidden] {
        display: none;
      }
      .setup-root {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        background: rgba(10, 14, 10, 0.9);
        color: #cfe8cf;
      }
      .setup-root h1 {
        margin: 0;
        padding: 16px 24px;
        border-bottom: 1px solid #2a3a2a;
        font-size: 18px;
        font-weight: normal;
        letter-spacing: 1px;
      }
      .setup-root .setup-body {
        flex: 1;
        padding: 16px 24px;
        overflow-y: auto;
      }
      .setup-root .setup-footer {
        padding: 12px 24px;
        border-top: 1px solid #2a3a2a;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .setup-root button {
        background: #1a2a1a;
        color: #cfe8cf;
        border: 1px solid #3a5a3a;
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      .setup-root button:hover {
        background: #2a4a2a;
      }
      .setup-root button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .setup-root select {
        background: #1a2a1a;
        color: #cfe8cf;
        border: 1px solid #3a5a3a;
        padding: 4px 8px;
        font: inherit;
      }
      .roster-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .roster-side {
        background: rgba(20, 30, 20, 0.5);
        border: 1px solid #2a3a2a;
        padding: 12px 16px;
      }
      .roster-side.faction-A {
        border-left: 3px solid #6ab0ff;
      }
      .roster-side.faction-B {
        border-left: 3px solid #ff8a6a;
      }
      .roster-side h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: normal;
      }
      .roster-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
        min-height: 60px;
      }
      .roster-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        background: rgba(10, 14, 10, 0.6);
        border: 1px solid #2a3a2a;
        font-size: 12px;
      }
      .roster-add {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .roster-count {
        margin-left: auto;
        font-size: 12px;
        color: #7a9a7a;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud-frame-glow" hidden>
      <div class="edge edge-left"></div>
      <div class="edge edge-right"></div>
      <div class="edge edge-top"></div>
      <div class="edge edge-bottom"></div>
    </div>
    <svg id="hud-frame" preserveAspectRatio="none" hidden>
      <rect id="hud-frame-rect" x="3" y="3" />
    </svg>
    <div id="hud">
      <div id="hud-top">
        <span id="hud-mission" hidden></span>
        <span id="hud-progress" class="tone-normal" hidden></span>
        <span id="hud-stealth" hidden style="color: #b8c8ff; font-weight: bold;">🌙 夜間隱密</span>
        <span id="hud-no-intel" hidden style="color: #ffaa66; font-weight: bold;">🚫 情報不明</span>
        <span>主動權 <strong id="hud-round">1</strong></span>
        <span>玩家活動 <strong id="hud-activations">0</strong></span>
        <span>Holder: <strong id="hud-holder">A</strong></span>
        <span>Momentum A: <strong id="hud-momentum-a">0</strong></span>
        <span>Momentum B: <strong id="hud-momentum-b">0</strong></span>
        <span id="hud-active"></span>
        <span id="hud-ai-toggles">
          <label><input type="checkbox" id="hud-ai-a" /> AI A</label>
          <label><input type="checkbox" id="hud-ai-b" /> AI B</label>
        </span>
        <span id="hud-timer" hidden></span>
        <button id="settings-gear-btn" title="Settings (ESC)" style="
          margin-left: auto; background: none; border: none;
          color: #7a9a7a; font-size: 14px; cursor: pointer; padding: 2px 6px;
          line-height: 1;
        ">⚙</button>
      </div>
      <div id="hud-unit-details" hidden></div>
      <div id="hud-actions"></div>
      <div id="hud-scrubber" hidden>
        <div id="hud-scrubber-row">
          <span id="hud-scrubber-label">Reaction t = 0.00</span>
          <div id="hud-scrubber-track">
            <div id="hud-scrubber-windows" aria-hidden="true"></div>
            <input
              type="range"
              id="hud-scrubber-input"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
          </div>
        </div>
        <div id="hud-scrubber-help">
          Drag to preview unit position. Click an enemy with green outline to
          place a SOLO reaction marker. Confirm in the panel.
        </div>
      </div>
      <div id="hud-log-wrap">
        <button id="hud-log-toggle" type="button" title="Collapse / expand log">▼ log</button>
        <div id="hud-log"></div>
      </div>
    </div>
    <!-- Settings overlay (ESC / ⚙) -->
    <div id="settings-menu" hidden>
      <div style="
        background: rgba(10,14,10,0.97); border: 1px solid #2a3a2a;
        min-width: 260px; color: #cfe8cf;
      ">
        <div style="
          display: flex; justify-content: space-between; align-items: center;
          padding: 10px 16px; border-bottom: 1px solid #2a3a2a;
        ">
          <span style="font-size: 13px; color: #7a9a7a; letter-spacing: 1px;">⚙ SETTINGS</span>
          <button id="settings-close-btn" style="
            background: none; border: none; color: #7a9a7a; font-size: 16px;
            cursor: pointer; padding: 0 4px; line-height: 1;
          ">✕</button>
        </div>
        <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
          <button id="settings-save-battle-btn" style="
            background: #1a2a1a; color: #cfe8cf; border: 1px solid #3a5a3a;
            padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
            text-align: left;
          ">💾 Save current battle</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
