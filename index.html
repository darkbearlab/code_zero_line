<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code: Zero Line</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0c0a;
        color: #cfe8cf;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
        height: 100%;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #hud > * {
        pointer-events: auto;
      }
      #hud-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 8px 16px;
        background: rgba(10, 14, 10, 0.85);
        border-bottom: 1px solid #2a3a2a;
        display: flex;
        gap: 18px;
        align-items: center;
        font-size: 13px;
      }
      #hud-unit-details {
        position: absolute;
        top: 48px;
        left: 12px;
        width: 280px;
        max-height: calc(100vh - 160px);
        overflow-y: auto;
        padding: 10px 12px;
        background: rgba(10, 14, 10, 0.92);
        border: 1px solid #3a5a3a;
        font-size: 12px;
        line-height: 1.45;
        color: #cfe8cf;
        pointer-events: none;
      }
      #hud-unit-details .ud-name {
        font-size: 14px;
        font-weight: bold;
        color: #cfe8cf;
        margin-bottom: 2px;
      }
      #hud-unit-details .ud-sub {
        font-size: 11px;
        color: #9aa89a;
        margin-bottom: 8px;
      }
      #hud-unit-details .ud-faction-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
        border: 1px solid #2a3a2a;
      }
      #hud-unit-details .ud-section {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid #2a3a2a;
      }
      #hud-unit-details .ud-section-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7a9a7a;
        margin-bottom: 4px;
      }
      #hud-unit-details .ud-stat {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      #hud-unit-details .ud-stat .k {
        color: #9aa89a;
      }
      #hud-unit-details .ud-stat .v {
        color: #cfe8cf;
      }
      #hud-unit-details .ud-stat .v.danger {
        color: #ff8a6a;
      }
      #hud-unit-details .ud-stat .v.warn {
        color: #ffd166;
      }
      #hud-unit-details .ud-list {
        margin: 0;
        padding-left: 0;
        list-style: none;
      }
      #hud-unit-details .ud-list li {
        padding: 2px 0;
      }
      #hud-unit-details .ud-trait .name {
        color: #9af09a;
        font-weight: bold;
      }
      #hud-unit-details .ud-trait .desc {
        display: block;
        color: #9aa89a;
        font-size: 11px;
        margin-left: 6px;
      }
      #hud-unit-details .ud-weapon .name {
        color: #cfe8cf;
      }
      #hud-unit-details .ud-weapon .meta {
        color: #7a9a7a;
        font-size: 11px;
        margin-left: 6px;
      }
      #hud-unit-details .ud-weapon .descs {
        display: block;
        color: #9aa89a;
        font-size: 11px;
        margin-left: 6px;
      }
      #hud-top .holder-A {
        color: #6ab0ff;
      }
      #hud-top .holder-B {
        color: #ff8a6a;
      }
      #hud-ai-toggles {
        margin-left: auto;
        display: inline-flex;
        gap: 10px;
        color: #cfe8cf;
      }
      #hud-ai-toggles label {
        cursor: pointer;
        user-select: none;
      }
      #hud-ai-toggles input {
        vertical-align: middle;
        margin-right: 4px;
      }
      #hud-timer {
        padding: 2px 8px;
        background: #1a2a1a;
        border: 1px solid #3a5a3a;
        color: #ffd166;
        font-variant-numeric: tabular-nums;
      }
      #hud-timer[hidden] {
        display: none;
      }
      #hud-frame {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }
      #hud-frame[hidden] {
        display: none;
      }
      #hud-frame-rect {
        fill: none;
        stroke-width: 6;
        vector-effect: non-scaling-stroke;
        transition: stroke 200ms ease;
      }
      #hud-frame-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        transition: box-shadow 200ms ease;
      }
      #hud-frame-glow[hidden] {
        display: none;
      }
      #hud-frame-glow.faction-A {
        box-shadow:
          inset 0 0 120px 18px rgba(106, 176, 255, 0.55),
          inset 0 0 32px 3px rgba(106, 176, 255, 0.85);
      }
      #hud-frame-glow.faction-B {
        box-shadow:
          inset 0 0 120px 18px rgba(255, 138, 106, 0.55),
          inset 0 0 32px 3px rgba(255, 138, 106, 0.85);
      }
      #hud-actions {
        position: absolute;
        right: 0;
        top: 48px;
        bottom: 80px;
        width: 260px;
        padding: 12px;
        background: rgba(10, 14, 10, 0.85);
        border-left: 1px solid #2a3a2a;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
        overflow-y: auto;
      }
      #hud-actions h3 {
        margin: 0 0 4px;
        font-size: 12px;
        color: #7a9a7a;
        font-weight: normal;
        letter-spacing: 0.5px;
      }
      #hud-actions button {
        background: #1a2a1a;
        color: #cfe8cf;
        border: 1px solid #3a5a3a;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      #hud-actions button:hover {
        background: #2a4a2a;
      }
      #hud-actions button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #hud-log-wrap {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 260px;
        background: rgba(10, 14, 10, 0.85);
        border-top: 1px solid #2a3a2a;
      }
      #hud-log-toggle {
        position: absolute;
        top: -22px;
        right: 8px;
        background: rgba(10, 14, 10, 0.95);
        border: 1px solid #2a3a2a;
        border-bottom: none;
        color: #cfe8cf;
        font: inherit;
        font-size: 11px;
        padding: 2px 10px;
        cursor: pointer;
        line-height: 1.4;
      }
      #hud-log-toggle:hover {
        background: #1a2a1a;
      }
      #hud-log {
        height: 80px;
        padding: 8px 16px;
        font-size: 12px;
        line-height: 1.5;
        overflow-y: auto;
        white-space: pre-wrap;
        color: #8aa28a;
      }
      #hud-log-wrap.collapsed #hud-log {
        height: 16px;
        padding-top: 1px;
        padding-bottom: 1px;
        line-height: 1.2;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #hud-scrubber {
        position: absolute;
        bottom: 80px;
        left: 0;
        right: 260px;
        padding: 10px 16px;
        background: rgba(20, 30, 20, 0.92);
        border-top: 1px solid #2a3a2a;
        font-size: 12px;
        z-index: 11;
      }
      #hud-scrubber[hidden] {
        display: none;
      }
      #hud-scrubber-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #hud-scrubber-label {
        min-width: 110px;
        color: #cfe8cf;
      }
      #hud-scrubber-track {
        flex: 1;
        position: relative;
        height: 22px;
        display: flex;
        align-items: center;
      }
      #hud-scrubber-windows {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        height: 6px;
        pointer-events: none;
        z-index: 1;
      }
      #hud-scrubber-windows .hud-scrubber-window {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(255, 85, 85, 0.6);
        border-radius: 1px;
      }
      #hud-scrubber-input {
        width: 100%;
        position: relative;
        z-index: 2;
        background: transparent;
      }
      #hud-scrubber-help {
        color: #7a9a7a;
        font-size: 11px;
        margin-top: 6px;
        line-height: 1.4;
      }
      .setup-root {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        background: rgba(10, 14, 10, 0.9);
        color: #cfe8cf;
      }
      .setup-root h1 {
        margin: 0;
        padding: 16px 24px;
        border-bottom: 1px solid #2a3a2a;
        font-size: 18px;
        font-weight: normal;
        letter-spacing: 1px;
      }
      .setup-root .setup-body {
        flex: 1;
        padding: 16px 24px;
        overflow-y: auto;
      }
      .setup-root .setup-footer {
        padding: 12px 24px;
        border-top: 1px solid #2a3a2a;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .setup-root button {
        background: #1a2a1a;
        color: #cfe8cf;
        border: 1px solid #3a5a3a;
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      .setup-root button:hover {
        background: #2a4a2a;
      }
      .setup-root button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .setup-root select {
        background: #1a2a1a;
        color: #cfe8cf;
        border: 1px solid #3a5a3a;
        padding: 4px 8px;
        font: inherit;
      }
      .roster-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .roster-side {
        background: rgba(20, 30, 20, 0.5);
        border: 1px solid #2a3a2a;
        padding: 12px 16px;
      }
      .roster-side.faction-A {
        border-left: 3px solid #6ab0ff;
      }
      .roster-side.faction-B {
        border-left: 3px solid #ff8a6a;
      }
      .roster-side h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: normal;
      }
      .roster-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
        min-height: 60px;
      }
      .roster-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        background: rgba(10, 14, 10, 0.6);
        border: 1px solid #2a3a2a;
        font-size: 12px;
      }
      .roster-add {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .roster-count {
        margin-left: auto;
        font-size: 12px;
        color: #7a9a7a;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud-frame-glow" hidden></div>
    <svg id="hud-frame" preserveAspectRatio="none" hidden>
      <rect id="hud-frame-rect" x="3" y="3" />
    </svg>
    <div id="hud">
      <div id="hud-top">
        <span id="hud-mission" hidden></span>
        <span>主動權 <strong id="hud-round">1</strong></span>
        <span>玩家活動 <strong id="hud-activations">0</strong></span>
        <span>Holder: <strong id="hud-holder">A</strong></span>
        <span>Momentum A: <strong id="hud-momentum-a">0</strong></span>
        <span>Momentum B: <strong id="hud-momentum-b">0</strong></span>
        <span id="hud-active"></span>
        <span id="hud-ai-toggles">
          <label><input type="checkbox" id="hud-ai-a" /> AI A</label>
          <label><input type="checkbox" id="hud-ai-b" /> AI B</label>
        </span>
        <span id="hud-timer" hidden></span>
      </div>
      <div id="hud-unit-details" hidden></div>
      <div id="hud-actions"></div>
      <div id="hud-scrubber" hidden>
        <div id="hud-scrubber-row">
          <span id="hud-scrubber-label">Reaction t = 0.00</span>
          <div id="hud-scrubber-track">
            <div id="hud-scrubber-windows" aria-hidden="true"></div>
            <input
              type="range"
              id="hud-scrubber-input"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
          </div>
        </div>
        <div id="hud-scrubber-help">
          Drag to preview unit position. Click an enemy with green outline to
          place a SOLO reaction marker. Confirm in the panel.
        </div>
      </div>
      <div id="hud-log-wrap">
        <button id="hud-log-toggle" type="button" title="Collapse / expand log">▼ log</button>
        <div id="hud-log"></div>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
